# ArenaShot Nginx 站点配置示例。
# 放置到 /etc/nginx/conf.d/arenashot.conf，替换域名与证书路径后：
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name game.example.com;
    # 申请证书时保留（certbot --webroot 也可直接放行 /.well-known）
    return 301 https://$host$request_uri;
}

server {
    # `listen ... ssl http2` 兼容 nginx 1.9.5+；nginx 1.25.1+ 会提示该写法已弃用但仍可用。
    # 若服务器是 1.25.1+，可改为 `listen 443 ssl;` + 独立的 `http2 on;`。
    listen 443 ssl http2;
    server_name game.example.com;

    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cocos web-mobile 构建产物（构建后 rsync 到这里）
    root  /var/www/arenashot;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源可长缓存；index.html 不缓存，避免发布后拿到旧入口。
    location ~* \.(js|css|png|jpe?g|webp|ogg|mp3|wasm|bin)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # WebSocket：与端上 defaultWsUrl() 的 wss://<host>/ws 对应
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 长连接不因默认 60s 空闲被切断；游戏内还有 2s 心跳
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查与配置接口（可选对外）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    client_max_body_size 4m;
}
